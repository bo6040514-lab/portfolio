<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>German Kids Academy – هيا نتعلم الألمانية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap">
<style>
:root{--p:#ff7a59;--s:#2bb3a8;--a:#ffd166;--bg:#fff8ef;--cd:#fff;--tx:#2b2d42;--ok:#2e9e5b;--no:#e0504a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2033;--cd:#2a2e48;--tx:#f4f1ea}}
:root[data-theme="dark"]{--bg:#1d2033;--cd:#2a2e48;--tx:#f4f1ea}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;font-size:18px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;max-width:760px;margin:auto}
header b{font-size:20px;color:var(--p)}
main{max-width:760px;margin:auto;padding:8px 14px 40px;text-align:center}
main.in{animation:up .4s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{font:inherit;font-weight:800;border:0;border-radius:18px;padding:14px 20px;margin:6px;background:var(--p);color:#1b1b1b;cursor:pointer;min-height:52px;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn:hover,.btn:focus-visible{transform:scale(1.05);outline:3px solid var(--a)}
.btn.s{background:var(--s)}.btn.a{background:var(--a)}.btn.g{background:var(--cd);color:var(--tx)}
.btn.big{width:100%;max-width:340px;font-size:21px}
.mascot{font-size:84px;animation:bob 2.4s ease-in-out infinite;display:inline-block}
h1{margin:4px 0;font-size:30px}h2{margin:10px 0}
.panel{display:flex;gap:8px;justify-content:center;margin:12px 0}
.panel div{background:var(--cd);border-radius:16px;padding:10px 14px;flex:1;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.panel b{display:block;font-size:26px;color:var(--p)}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.badges span{background:var(--a);color:#1b1b1b;border-radius:20px;padding:4px 12px;font-size:15px;font-weight:700}
.badges span.off{opacity:.35;filter:grayscale(1)}
.card{background:var(--cd);border-radius:26px;padding:20px;margin:12px auto;max-width:380px;box-shadow:0 6px 18px rgba(0,0,0,.15);animation:up .35s}
.em{font-size:76px;line-height:1.1}
.opt .em{font-size:46px}
.sw{display:inline-block;width:84px;height:84px;border-radius:50%;border:3px solid rgba(0,0,0,.25)}
.de{font-size:34px;font-weight:800;color:var(--s);direction:ltr}
.de2{font-size:24px;direction:ltr}
.ar{font-size:22px;margin:4px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.opt{font:inherit;background:var(--cd);color:var(--tx);border:3px solid transparent;border-radius:20px;padding:12px;cursor:pointer;min-height:90px;transition:transform .2s,border-color .2s}
.opt:hover,.opt:focus-visible{transform:scale(1.04);border-color:var(--a);outline:0}
.opt.no{border-color:var(--no);animation:shake .4s;opacity:.5}
.bar{height:12px;background:rgba(128,128,128,.25);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--s);transition:width .4s}
.fb{min-height:34px;font-weight:800;font-size:22px}
.chip{font:inherit;direction:ltr;background:var(--a);color:#1b1b1b;border:0;border-radius:14px;padding:10px 14px;margin:4px;font-weight:800;font-size:20px;cursor:pointer}
.line{min-height:62px;border:3px dashed var(--s);border-radius:16px;padding:6px;margin:10px 0;direction:ltr}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{font:inherit;aspect-ratio:1;border:0;border-radius:16px;background:var(--s);color:#fff;font-size:30px;cursor:pointer;transition:transform .3s;padding:2px;font-weight:800}
.mc.o{background:var(--cd);color:var(--tx)}.mc.m{background:#bfeccf;color:#1b1b1b}
.mc span{font-size:16px;direction:ltr;display:block}
.mc .em{font-size:34px}
.note{font-size:15px;opacity:.8;margin:8px 0}
#toast{position:fixed;bottom:20px;inset-inline:16px;margin:auto;max-width:420px;background:#2b2d42;color:#fff;padding:12px;border-radius:14px;display:none;z-index:9}
.star{position:fixed;top:-30px;font-size:28px;animation:fall 2.2s linear forwards;pointer-events:none;z-index:8}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><button class="btn g" onclick="go(home)" aria-label="الرئيسية">🏠</button><b>German Kids Academy</b><button class="btn g" id="mu" onclick="mute()" aria-label="كتم المؤثرات">🔔</button></header>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
let S={done:{},stars:0,pts:0,ok:0,bad:0,best:{},last:'',spk:0,mute:false};
try{Object.assign(S,JSON.parse(localStorage.getItem('gka')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('gka',JSON.stringify(S))}catch(e){}};
const sh=a=>[...a].sort(()=>Math.random()-.5),rnd=a=>a[Math.floor(Math.random()*a.length)];
const I=(d,a,e,o={})=>({d,a,e,...o});
/* ---------- المحتوى ---------- */
const LET=[['A','Apfel','🍎','تفاحة'],['B','Banane','🍌','موزة'],['C','Clown','🤡','مهرج'],['D','Delfin','🐬','دلفين'],['E','Elefant','🐘','فيل'],['F','Fisch','🐟','سمكة'],['G','Giraffe','🦒','زرافة'],['H','Hund','🐶','كلب'],['I','Igel','🦔','قنفذ'],['J','Jacke','🧥','سترة'],['K','Katze','🐱','قطة'],['L','Löwe','🦁','أسد'],['M','Milch','🥛','حليب'],['N','Nase','👃','أنف'],['O','Orange','🍊','برتقالة'],['P','Pinguin','🐧','بطريق'],['Q','Qualle','🪼','قنديل بحر'],['R','Rose','🌹','وردة'],['S','Sonne','☀️','شمس'],['T','Tiger','🐯','نمر'],['U','Uhr','⏰','ساعة'],['V','Vogel','🐦','طائر'],['W','Wasser','💧','ماء'],['X','Xylophon','🎶','إكسيليفون'],['Y','Yoga','🧘','يوغا'],['Z','Zebra','🦓','حمار وحشي'],['Ä','Äpfel','🍏','تفاح'],['Ö','Öl','🛢️','زيت'],['Ü','Überraschung','🎁','مفاجأة'],['ß','Fuß','🦶','قدم']];
const NA='null eins zwei drei vier fünf sechs sieben acht neun zehn elf zwölf dreizehn vierzehn fünfzehn sechzehn siebzehn achtzehn neunzehn zwanzig'.split(' ');
const NR='صفر واحد اثنان ثلاثة أربعة خمسة ستة سبعة ثمانية تسعة عشرة أحد_عشر اثنا_عشر ثلاثة_عشر أربعة_عشر خمسة_عشر ستة_عشر سبعة_عشر ثمانية_عشر تسعة_عشر عشرون'.split(' ').map(x=>x.replace('_',' '));
const TD='dreißig vierzig fünfzig sechzig siebzig achtzig neunzig hundert'.split(' '),TR=['ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون','مئة'];
const nums=NA.map((d,i)=>I(d,NR[i],String(i))).concat(TD.map((d,i)=>I(d,TR[i],String(i<7?30+i*10:100))));
const col=(d,a,c)=>I(d,a,'',{c});
const U=[
{id:'letters',n:'الحروف',e:'🔤',b:'نجم الحروف',i:LET.map(([l,w,e,a])=>I(l=='ß'?'ß':l+' '+l.toLowerCase(),a,e,{w,say:[l,w]}))},
{id:'numbers',n:'الأرقام',e:'🔢',b:'بطل الأرقام',i:nums},
{id:'colors',n:'الألوان',e:'🎨',i:[col('Rot','أحمر','#e53935'),col('Blau','أزرق','#1e88e5'),col('Grün','أخضر','#43a047'),col('Gelb','أصفر','#fdd835'),col('Schwarz','أسود','#212121'),col('Weiß','أبيض','#ffffff')]},
{id:'animals',n:'الحيوانات',e:'🐱',b:'صديق الحيوانات',i:[I('Katze','قطة','🐱'),I('Hund','كلب','🐶'),I('Vogel','طائر','🐦'),I('Hase','أرنب','🐰'),I('Löwe','أسد','🦁'),I('Fisch','سمكة','🐟'),I('Pferd','حصان','🐴')]},
{id:'family',n:'الأسرة',e:'👨‍👩‍👧',i:[I('Mutter','الأم','👩'),I('Vater','الأب','👨'),I('Bruder','الأخ','👦'),I('Schwester','الأخت','👧'),I('Familie','الأسرة','👨‍👩‍👧')]},
{id:'food',n:'الطعام والشراب',e:'🍎',i:[I('Apfel','تفاحة','🍎'),I('Brot','خبز','🍞'),I('Milch','حليب','🥛'),I('Wasser','ماء','💧'),I('Banane','موزة','🍌'),I('Käse','جبن','🧀')]},
{id:'body',n:'أجزاء الجسم',e:'🖐️',i:[I('Kopf','رأس','🗣️'),I('Hand','يد','✋'),I('Auge','عين','👁️'),I('Nase','أنف','👃'),I('Mund','فم','👄'),I('Ohr','أذن','👂'),I('Fuß','قدم','🦶')]},
{id:'greet',n:'التحيات',e:'👋',i:[I('Hallo!','مرحبًا','👋'),I('Guten Morgen!','صباح الخير','🌅'),I('Wie heißt du?','ما اسمك؟','❓'),I('Ich heiße …','اسمي …','🙋',{say:'Ich heiße'}),I('Wie geht es dir?','كيف حالك؟','😊'),I('Danke!','شكرًا','🙏'),I('Auf Wiedersehen!','إلى اللقاء','🤚')]},
{id:'sent',n:'الجمل البسيطة',e:'💬',i:[I('Das ist eine Katze.','هذه قطة.','🐱'),I('Ich bin ein Kind.','أنا طفل.','🧒'),I('Ich habe einen Ball.','لدي كرة.','⚽'),I('Ich mag Äpfel.','أحب التفاح.','🍏')]}
];
const UM={},REG=[];U.forEach(u=>{UM[u.id]=u;u.i.forEach(x=>{x.id=REG.length;REG.push(x)})});
const W=['colors','animals','family','food','body'].flatMap(k=>UM[k].i);
/* ---------- صوت ومؤثرات ---------- */
let voices=[],warned=false,ac;
if('speechSynthesis' in window){const lv=()=>{voices=speechSynthesis.getVoices()};lv();speechSynthesis.onvoiceschanged=lv}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4500)}
function say(t){if(!('speechSynthesis' in window)){toast('هذا المتصفح لا يدعم النطق الصوتي');return}
 const v=voices.find(v=>v.lang.toLowerCase().startsWith('de'));
 if(!v&&!warned){warned=true;toast('لا يوجد صوت ألماني مثبت على هذا الجهاز وسيُستخدم الصوت الافتراضي')}
 speechSynthesis.cancel();[].concat(t).forEach(x=>{const u=new SpeechSynthesisUtterance(x);u.lang='de-DE';if(v)u.voice=v;u.rate=.8;speechSynthesis.speak(u)})}
function sfx(ok){if(S.mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);g.gain.value=.08;o.frequency.value=ok?660:220;o.frequency.setValueAtTime(ok?880:180,ac.currentTime+.12);o.start();o.stop(ac.currentTime+.25)}catch(e){}}
function mute(){S.mute=!S.mute;sv();$('#mu').textContent=S.mute?'🔕':'🔔'}
$('#mu').textContent=S.mute?'🔕':'🔔';
function burst(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<14;i++){const s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=Math.random()*95+'%';s.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3000)}}
/* ---------- عناصر مشتركة ---------- */
const vis=x=>x.c?`<span class="sw" style="background:${x.c}"></span>`:`<span class="em">${x.e}</span>`;
const card=x=>`<div class="card">${vis(x)}<div class="de" dir="ltr">${x.d}</div>${x.w?`<div class="de2" dir="ltr">${x.w}</div>`:''}<div class="ar">${x.a}</div><button class="btn s" onclick="sayId(${x.id})">🔊 استمع</button></div>`;
const sayId=i=>say(REG[i].say||REG[i].d);
function go(f){app.classList.remove('in');void app.offsetWidth;f();app.classList.add('in');scrollTo(0,0)}
function finish(key,sc,n,again,done,title){const st=sc>=n?3:sc>=n*.6?2:1;S.stars+=st;S.best[key]=Math.max(S.best[key]||0,sc);if(done)done();sv();burst();sfx(1);
 app.innerHTML=`<h2>${title||'النتيجة'}</h2><div class="mascot">🐻</div><h1>${'⭐'.repeat(st)}</h1><p>أجبت ${sc} من ${n} بشكل صحيح من المحاولة الأولى</p><p class="note">أفضل نتيجة ${S.best[key]}</p><button class="btn" id="ag">🔁 مرة أخرى</button><button class="btn g" onclick="go(home)">🏠 الرئيسية</button>`;$('#ag').onclick=()=>go(again)}
function badges(){const d=Object.keys(S.done).length,B=U.filter(u=>u.b).map(u=>[u.b,S.done[u.id]]);B.push(['بطل الكلمات',d>=5],['متحدث صغير',S.spk>=5]);return `<div class="badges">${B.map(([n,o])=>`<span class="${o?'':'off'}">🏅 ${n}</span>`).join('')}</div>`}
/* ---------- الشاشات ---------- */
function home(){const d=Object.keys(S.done).length;
 app.innerHTML=`<div class="mascot">🐻</div><h1>German Kids Academy</h1><h2>هيا نتعلم الألمانية</h2>
 <div class="panel"><div><b>${d}/${U.length}</b>دروس</div><div><b>${S.pts}</b>نقاط</div><div><b>${S.stars}</b>نجوم</div></div>${badges()}
 <button class="btn big" onclick="go(units)">🚀 ابدأ التعلم</button>
 <button class="btn big s" onclick="go(gallery)">🖼️ الكلمات المصورة</button>
 <button class="btn big a" onclick="go(games)">🎮 الألعاب التعليمية</button>
 <button class="btn big s" onclick="go(speakScr)">🎤 استمع وتحدث</button>
 <button class="btn big g" onclick="go(review)">📚 مراجعة ما تعلمته</button>
 ${S.last?`<p><button class="btn g" onclick="go(()=>lesson('${S.last}',0))">▶️ تابع من: ${UM[S.last].n}</button></p>`:''}
 <p><button class="btn g" onclick="resetAll()">إعادة تعيين التقدم</button></p>
 <p class="note">يُحفظ التقدم على هذا الجهاز فقط ولا تُجمع أي بيانات شخصية</p>`}
function resetAll(){if(confirm('هل تريد حذف كل التقدم؟')){S={done:{},stars:0,pts:0,ok:0,bad:0,best:{},last:'',spk:0,mute:S.mute};sv();go(home)}}
function units(){app.innerHTML=`<h2>اختر الوحدة</h2><div class="grid">${U.map(u=>`<button class="btn ${S.done[u.id]?'s':'a'}" onclick="go(()=>lesson('${u.id}',0))">${u.e}<br>${u.n}${S.done[u.id]?' ✅':''}</button>`).join('')}</div>`}
function lesson(id,k){const u=UM[id],x=u.i[k];S.last=id;sv();
 app.innerHTML=`<h2>${u.e} ${u.n} ${k+1}/${u.i.length}</h2><div class="bar"><i style="width:${(k+1)/u.i.length*100}%"></i></div>${card(x)}
 <div><button class="btn g" ${k?'':'disabled'} onclick="go(()=>lesson('${id}',${k-1}))">▶ السابق</button><button class="btn" id="nx">${k+1<u.i.length?'التالي ◀':'ابدأ التمرين 🎯'}</button></div>`;
 $('#nx').onclick=()=>go(()=>k+1<u.i.length?lesson(id,k+1):unitQuiz(id))}
function unitQuiz(id){const u=UM[id];quiz({pool:u.i,n:5,title:'تمرين '+u.n,key:'u_'+id,again:()=>unitQuiz(id),done:()=>{S.done[id]=1}})}
function gallery(){app.innerHTML=`<h2>الكلمات المصورة</h2><p class="note">اضغط على أي بطاقة لسماع الاسم</p><div class="grid">${U.filter(u=>!['numbers','letters','sent','greet'].includes(u.id)).flatMap(u=>u.i).map(x=>`<button class="opt" onclick="sayId(${x.id})">${vis(x)}<div class="de" style="font-size:22px">${x.d}</div><div style="font-size:16px">${x.a}</div></button>`).join('')}</div>`}
function quiz(o){let q=0,sc=0,tried=false,t;
 function nx(){if(q>=o.n)return finish(o.key,sc,o.n,o.again,o.done,o.title);
  t=rnd(o.pool);const ops=sh([t,...sh(o.pool.filter(x=>x!==t)).slice(0,3)]);tried=false;
  app.innerHTML=`<h2>${o.title} ${q+1}/${o.n}</h2><div class="bar"><i style="width:${q/o.n*100}%"></i></div><p>استمع ثم اختر الصورة الصحيحة</p><button class="btn big s" id="pl">🔊 استمع</button><div class="grid4">${ops.map((x,j)=>`<button class="opt" data-j="${j}">${vis(x)}${x.c||/^\d+$/.test(x.e)?'':''}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
  $('#pl').onclick=()=>say(t.say||t.d);say(t.say||t.d);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(ops[b.dataset.j]===t){if(!tried)sc++;S.pts+=tried?2:10;S.ok++;sfx(1);$('#fb').textContent='🎉 أحسنت';sv();q++;setTimeout(nx,900)}else{tried=true;S.bad++;sfx(0);b.classList.add('no');b.disabled=true;$('#fb').textContent='حاول مرة أخرى 💪';sv()}})}
 if(o.pool.length<4){toast('عدد العناصر غير كاف');return go(home)}nx()}
function games(){app.innerHTML=`<h2>الألعاب</h2>
 <button class="btn big" onclick="go(gListen)">👂 استمع واختر</button>
 <button class="btn big s" onclick="go(gFill)">✏️ أكمل الكلمة</button>
 <button class="btn big a" onclick="go(gColor)">🌈 لعبة الألوان</button>
 <button class="btn big s" onclick="go(gOrder)">🧩 ترتيب الكلمات</button>
 <button class="btn big" onclick="go(gMem)">🃏 لعبة الذاكرة</button>`}
const gListen=()=>quiz({pool:W,n:6,title:'استمع واختر',key:'listen',again:gListen});
const gColor=()=>quiz({pool:UM.colors.i,n:6,title:'لعبة الألوان',key:'color',again:gColor});
function gFill(){const AB='abcdefghijklmnoprstuw'.split(''),n=5;let q=0,sc=0,tried=false;
 function nx(){if(q>=n)return finish('fill',sc,n,gFill,null,'أكمل الكلمة');
  const x=rnd(W),w=x.d,ix=sh([...w].map((c,i)=>/[A-Za-zÄÖÜäöüß]/.test(c)&&i>0?i:-1).filter(i=>i>0))[0],c=w[ix],lo=c.toLowerCase(),up=c!==lo;
  const ops=sh([lo,...sh(AB.filter(l=>l!==lo)).slice(0,3)]).map(l=>up?l.toUpperCase():l);tried=false;
  app.innerHTML=`<h2>أكمل الكلمة ${q+1}/${n}</h2><div class="bar"><i style="width:${q/n*100}%"></i></div><div class="card">${vis(x)}<div class="de" dir="ltr">${w.slice(0,ix)}_${w.slice(ix+1)}</div><div class="ar">${x.a}</div><button class="btn s" onclick="sayId(${x.id})">🔊 استمع</button></div><div class="grid4">${ops.map(l=>`<button class="opt de" data-l="${l}">${l}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.dataset.l===c){if(!tried)sc++;S.pts+=tried?2:10;S.ok++;sfx(1);$('#fb').textContent='🎉 أحسنت '+w;sayId(x.id);sv();q++;setTimeout(nx,1200)}else{tried=true;S.bad++;sfx(0);b.classList.add('no');b.disabled=true;$('#fb').textContent='حاول مرة أخرى 💪';sv()}})}
 nx()}
function gOrder(){const P=sh(UM.sent.i),n=P.length;let q=0,sc=0,tried=false;
 function nx(){if(q>=n)return finish('order',sc,n,gOrder,null,'ترتيب الكلمات');
  const x=P[q],ws=x.d.split(' ');let pool=sh(ws.map((w,i)=>({w,i}))),ans=[];tried=false;
  const draw=()=>{app.innerHTML=`<h2>رتب الجملة ${q+1}/${n}</h2><div class="bar"><i style="width:${q/n*100}%"></i></div><div class="ar">${x.a} ${x.e}</div><div class="line" id="ln">${ans.map((o,k)=>`<button class="chip" data-k="${k}">${o.w}</button>`).join('')}</div><div dir="ltr">${pool.map((o,k)=>`<button class="chip" data-p="${k}">${o.w}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
   app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const o=pool.splice(b.dataset.p,1)[0];ans.push(o);say(o.w);if(!pool.length){if(ans.map(o=>o.w).join(' ')===x.d){if(!tried)sc++;S.pts+=tried?2:10;S.ok++;sfx(1);draw();$('#fb').textContent='🎉 أحسنت';sayId(x.id);sv();q++;return void setTimeout(nx,1500)}tried=true;S.bad++;sfx(0);pool=ans;ans=[];sv();draw();$('#fb').textContent='حاول مرة أخرى 💪';return}draw()});
   app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{pool.push(ans.splice(b.dataset.k,1)[0]);draw()})};
  draw()}
 nx()}
function gMem(){const a=sh(W).slice(0,6);let cs=sh([...a.map(x=>({x,t:'e'})),...a.map(x=>({x,t:'d'}))]),open=[],mv=0,mt=0,lock=false;
 app.innerHTML=`<h2>لعبة الذاكرة</h2><p class="note">طابق الصورة مع الكلمة الألمانية</p><div class="mem">${cs.map((c,i)=>`<button class="mc" data-i="${i}" aria-label="بطاقة">?</button>`).join('')}</div><p id="mv">الحركات 0</p>`;
 app.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,c=cs[i];if(lock||b.classList.contains('o')||b.classList.contains('m'))return;
  b.classList.add('o');b.innerHTML=c.t=='e'?vis(c.x):`<span>${c.x.d}</span>`;if(c.t=='d')say(c.x.d);open.push(b);
  if(open.length==2){mv++;$('#mv').textContent='الحركات '+mv;const [p,r]=open.map(z=>cs[z.dataset.i]);
   if(p.x===r.x&&p.t!==r.t){open.forEach(z=>{z.classList.remove('o');z.classList.add('m')});open=[];sfx(1);S.pts+=10;sv();if(++mt==6)setTimeout(()=>finish('mem',mv<=8?6:mv<=12?4:2,6,gMem,null,'لعبة الذاكرة'),700)}
   else{lock=true;setTimeout(()=>{open.forEach(z=>{z.classList.remove('o');z.textContent='?'});open=[];lock=false},900)}}})}
function review(){const ds=U.filter(u=>S.done[u.id]);
 if(!ds.length){app.innerHTML=`<h2>المراجعة</h2><div class="mascot">🐻</div><p>أكمل درسًا واحدًا على الأقل لتظهر هنا</p><button class="btn" onclick="go(units)">ابدأ التعلم</button>`;return}
 app.innerHTML=`<h2>الدروس التي أكملتها</h2><div class="grid">${ds.map(u=>`<button class="btn s" onclick="go(()=>lesson('${u.id}',0))">${u.e}<br>${u.n}</button>`).join('')}</div><h2>مراجعة سريعة</h2><button class="btn big a" id="rq">🎯 اختبر نفسك</button><p class="note">النتيجة الصحيحة ${S.ok} والمحاولات الخاطئة ${S.bad}</p>`;
 $('#rq').onclick=()=>{const pool=ds.flatMap(u=>u.i);if(pool.length<4)return toast('أكمل المزيد من الدروس');go(()=>quiz({pool,n:6,title:'مراجعة',key:'review',again:review}))}}
function speakScr(){app.innerHTML=`<h2>استمع وتحدث</h2><p class="note">اختر كلمة ثم استمع إليها ثم قلها بصوتك</p><div class="grid">${W.map(x=>`<button class="opt" onclick="pick(${x.id})">${vis(x)}<div class="de" style="font-size:20px">${x.d}</div></button>`).join('')}</div><div id="sp"></div>`}
function pick(i){const x=REG[i];$('#sp').innerHTML=card(x)+`<button class="btn" onclick="mic(${i})">🎤 قلها الآن</button><p id="msg" class="fb"></p><p class="note">التعرف على الكلام عام وليس تقييمًا احترافيًا للنطق وقد يحتاج المتصفح إلى اتصال بالإنترنت</p>`;say(x.say||x.d);$('#sp').scrollIntoView({behavior:'smooth'})}
function mic(i){const x=REG[i],R=window.SpeechRecognition||window.webkitSpeechRecognition,m=$('#msg');
 if(!R){m.textContent='هذا المتصفح لا يدعم التعرف على الصوت يمكنك الاستماع والتكرار بصوت عال';return}
 const cl=s=>s.toLowerCase().replace(/[^a-zäöüß ]/g,'').trim();
 try{const r=new R();r.lang='de-DE';m.textContent='المتصفح سيطلب إذن الميكروفون لسماع نطقك فقط';
  r.onresult=e=>{const h=cl(e.results[0][0].transcript);S.spk++;sv();const ok=h.includes(cl(x.say||x.d));if(ok){sfx(1);burst()}m.textContent='سمعتك تقول: '+h+(ok?' ✅ ممتاز':' ← حاول مرة أخرى')};
  r.onerror=()=>{m.textContent='تعذر استخدام الميكروفون تأكد من السماح به'};r.start()}catch(e){m.textContent='تعذر تشغيل الميكروفون'}}
home();app.classList.add('in');
</script>
